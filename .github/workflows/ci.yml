name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test-and-build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Vet & Test
        run: |
          go vet ./...
          go test -v ./...

      - name: Build native binary
        shell: bash
        run: |
          mkdir -p bin
          EXT=""
          if [ "${RUNNER_OS}" = "Windows" ]; then EXT=".exe"; fi
          go build -ldflags="-s -w" -o "bin/azero${EXT}" ./cmd/azero
          ./bin/azero${EXT} version

      - name: Smoke test cross-platform SessionStart hook
        shell: bash
        run: |
          OUT=$(node -e 'process.stdout.write(JSON.stringify({cwd: process.cwd()}) + "\n")' | node scripts/hook.mjs session-start)
          echo "$OUT"
          echo "$OUT" | grep -q "injectSteps"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Cross-compile release binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/azero-linux-amd64 ./cmd/azero
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/azero-linux-arm64 ./cmd/azero
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/azero-darwin-arm64 ./cmd/azero
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/azero-darwin-amd64 ./cmd/azero
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/azero-windows-amd64.exe ./cmd/azero
          cd dist && sha256sum azero-* > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
